name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        exclude:
          # setup-python has no 3.9 build for the current Ubuntu image (3.9 is EOL);
          # the 3.9 floor is still covered on macOS and Windows.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Vendored shared code is in sync
        run: python scripts/sync_shared.py --check
      - name: Unit tests (no network)
        run: python -m pytest -q tests
      - name: Skill packages validate and build
        run: python scripts/package_skills.py
